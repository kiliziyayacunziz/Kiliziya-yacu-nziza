<!DOCTYPE html>
<html lang="rw">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="robots"
          content="noindex, nofollow">

    <title>
        Admin | Kiliziya Yacu Nziza
    </title>

    <link rel="stylesheet"
          href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>


<body class="admin-body">

<div class="admin-page">

    <header class="admin-topbar">

        <strong>
            ✝ Kiliziya Yacu Nziza — Admin
        </strong>

        <a href="index.html">
            ← Subira ku rubuga
        </a>

    </header>


    <main class="admin-main">

        <!-- LOGIN -->

        <section id="loginSection"
                 class="login-card">

            <h1>Admin Login</h1>

            <p>
                Injira ukoresheje konti ya Admin
                yashyizwe muri Supabase.
            </p>


            <form id="loginForm">

                <label>
                    Email

                    <input
                        type="email"
                        id="adminEmail"
                        required
                    >
                </label>


                <label>
                    Password

                    <input
                        type="password"
                        id="adminPassword"
                        required
                    >
                </label>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Injira
                </button>


                <p
                    id="loginMessage"
                    class="status-message"
                ></p>

            </form>

        </section>


        <!-- DASHBOARD -->

        <section
            id="adminDashboard"
            class="admin-dashboard"
        >

            <div class="admin-welcome">

                <div>

                    <p class="section-kicker">
                        ADMIN DASHBOARD
                    </p>

                    <h1>
                        Murakaza neza
                    </h1>

                    <p id="loggedUser"></p>

                </div>


                <button
                    id="logoutButton"
                    class="logout-button"
                >
                    Sohoka
                </button>

            </div>


            <!-- DAILY READINGS -->

            <div class="admin-panel">

                <h2>
                    📖 Amasomo y'umunsi
                </h2>


                <form
                    id="readingForm"
                    class="admin-form"
                >

                    <label>
                        Itariki

                        <input
                            type="date"
                            id="reading_date"
                            required
                        >
                    </label>


                    <label>
                        Isomo rya mbere

                        <textarea
                            id="first_reading"
                            rows="4"
                            required
                        ></textarea>
                    </label>


                    <label>
                        Zaburi

                        <textarea
                            id="reading_psalm"
                            rows="4"
                            required
                        ></textarea>
                    </label>


                    <label>
                        Ivanjili

                        <textarea
                            id="reading_gospel"
                            rows="4"
                            required
                        ></textarea>
                    </label>


                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Bika amasomo
                    </button>


                    <p
                        id="readingMessage"
                        class="status-message"
                    ></p>

                </form>

            </div>


            <!-- FUTURE CONTENT -->

            <div class="admin-panel">

                <h2>
                    Ibindi bizacungwa hano
                </h2>

                <p>
                    Kuzirikana • Isengesho • Amafoto •
                    PDF • Ibitabo • Audio/Video • Links
                </p>

            </div>

        </section>

    </main>

</div>


<script>

const SUPABASE_URL =
    "https://iqurlyrppouwcssctonu.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_QZVM-iXloVEDgc7fpwZhCQ_4bHRfp8d";


const client =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


const loginSection =
    document.getElementById("loginSection");

const dashboard =
    document.getElementById("adminDashboard");

const loggedUser =
    document.getElementById("loggedUser");


function showDashboard(user) {

    loginSection.style.display = "none";

    dashboard.style.display = "block";

    loggedUser.textContent =
        "Winjiye nka: " + user.email;
}


function showLogin() {

    dashboard.style.display = "none";

    loginSection.style.display = "block";
}


async function checkSession() {

    const {
        data: { session }
    } =
        await client.auth.getSession();


    if (session && session.user) {

        showDashboard(
            session.user
        );

    } else {

        showLogin();
    }
}


document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            const email =
                document
                    .getElementById(
                        "adminEmail"
                    )
                    .value
                    .trim();


            const password =
                document
                    .getElementById(
                        "adminPassword"
                    )
                    .value;


            const message =
                document
                    .getElementById(
                        "loginMessage"
                    );


            message.textContent =
                "Tegereza...";


            const {
                data,
                error
            } =
                await client.auth
                    .signInWithPassword({
                        email,
                        password
                    });


            if (error) {

                message.textContent =
                    "Login yanze: " +
                    error.message;

                return;
            }


            message.textContent = "";


            showDashboard(
                data.user
            );
        }
    );


document
    .getElementById("logoutButton")
    .addEventListener(
        "click",
        async () => {

            await client.auth.signOut();

            showLogin();
        }
    );


document
    .getElementById("readingForm")
    .addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            const message =
                document
                    .getElementById(
                        "readingMessage"
                    );


            const reading_date =
                document
                    .getElementById(
                        "reading_date"
                    )
                    .value;


            const first_reading =
                document
                    .getElementById(
                        "first_reading"
                    )
                    .value
                    .trim();


            const psalm =
                document
                    .getElementById(
                        "reading_psalm"
                    )
                    .value
                    .trim();


            const gospel =
                document
                    .getElementById(
                        "reading_gospel"
                    )
                    .value
                    .trim();


            message.textContent =
                "Birimo kubikwa...";


            const {
                data: existing,
                error: searchError
            } =
                await client
                    .from("daily_readings")
                    .select("id")
                    .eq(
                        "reading_date",
                        reading_date
                    )
                    .limit(1);


            if (searchError) {

                message.textContent =
                    "Habaye ikibazo: " +
                    searchError.message;

                return;
            }


            let result;


            if (
                existing &&
                existing.length > 0
            ) {

                result =
                    await client
                        .from(
                            "daily_readings"
                        )
                        .update({
                            first_reading,
                            psalm,
                            gospel,
                            published: true,
                            updated_at:
                                new Date()
                                    .toISOString()
                        })
                        .eq(
                            "id",
                            existing[0].id
                        );

            } else {

                result =
                    await client
                        .from(
                            "daily_readings"
                        )
                        .insert({
                            reading_date,
                            first_reading,
                            psalm,
                            gospel,
                            published: true
                        });
            }


            if (result.error) {

                message.textContent =
                    "Ntibyabitswe: " +
                    result.error.message;

                return;
            }


            message.textContent =
                "✓ Amasomo yabitswe neza!";


            document
                .getElementById(
                    "readingForm"
                )
                .reset();
        }
    );


client.auth.onAuthStateChange(
    (event, session) => {

        if (
            session &&
            session.user
        ) {

            showDashboard(
                session.user
            );

        } else {

            showLogin();
        }
    }
);


checkSession();

</script>

</body>
</html>
